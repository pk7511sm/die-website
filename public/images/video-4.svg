<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12"/><stop offset="100%" stop-color="#1A232D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)"/>
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>
  <!-- 除屑模具示意：底板 + 頂出針 -->
  <g transform="translate(250, 60)">
    <!-- 底板 -->
    <rect x="0" y="100" width="280" height="150" rx="3" fill="#2B3A4A" opacity="0.3"/>
    <rect x="0" y="100" width="280" height="150" rx="3" fill="none" stroke="#5a6a7c" stroke-width="1" opacity="0.4"/>
    <!-- 裁切區域 -->
    <rect x="30" y="120" width="90" height="60" rx="2" fill="none" stroke="#E8590C" stroke-width="1.5" opacity="0.6"/>
    <rect x="150" y="120" width="100" height="60" rx="2" fill="none" stroke="#E8590C" stroke-width="1.5" opacity="0.6"/>
    <!-- 除屑頂針 -->
    <circle cx="75" cy="150" r="6" fill="#E8590C" opacity="0.3"/>
    <circle cx="75" cy="150" r="3" fill="#E8590C" opacity="0.7"/>
    <circle cx="200" cy="150" r="6" fill="#E8590C" opacity="0.3"/>
    <circle cx="200" cy="150" r="3" fill="#E8590C" opacity="0.7"/>
    <!-- 廢料飛出示意（向上箭頭） -->
    <path d="M 75 135 L 75 100" stroke="#E8590C" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
    <path d="M 71 106 L 75 98 L 79 106" fill="none" stroke="#E8590C" stroke-width="1" opacity="0.5"/>
    <path d="M 200 135 L 200 100" stroke="#E8590C" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
    <path d="M 196 106 L 200 98 L 204 106" fill="none" stroke="#E8590C" stroke-width="1" opacity="0.5"/>
    <!-- 廢料小方塊 -->
    <rect x="65" y="75" width="20" height="15" rx="2" fill="#5a6a7c" opacity="0.3" transform="rotate(-10 75 82)"/>
    <rect x="190" y="70" width="20" height="15" rx="2" fill="#5a6a7c" opacity="0.3" transform="rotate(8 200 77)"/>
    <!-- 專利標記 -->
    <rect x="60" y="210" width="160" height="24" rx="12" fill="#E8590C" opacity="0.15"/>
    <text x="140" y="227" font-family="system-ui,sans-serif" font-size="11" fill="#E8590C" text-anchor="middle" font-weight="600" opacity="0.8">本公司專利 PATENTED</text>
  </g>
  <!-- 標題 -->
  <rect x="60" y="350" width="40" height="2" rx="1" fill="#E8590C" opacity="0.8"/>
  <text x="60" y="382" font-family="system-ui,sans-serif" font-size="24" fill="#ffffff" font-weight="700" opacity="0.95">除屑模具介紹</text>
  <text x="60" y="405" font-family="system-ui,sans-serif" font-size="13" fill="#9AA5AE" font-weight="400">Waste Stripping Die Introduction</text>
  <rect x="660" y="365" width="80" height="28" rx="14" fill="#ffffff" opacity="0.1"/>
  <text x="700" y="384" font-family="system-ui,sans-serif" font-size="11" fill="#9AA5AE" text-anchor="middle">▶ Instagram</text>
</svg>
