<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12"/><stop offset="100%" stop-color="#1A232D"/>
    </linearGradient>
    <filter id="gl3"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>
  <!-- 製程步驟示意 -->
  <g transform="translate(160, 100)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="100" height="70" rx="4" fill="#ffffff" opacity="0.04"/>
    <rect x="0" y="0" width="100" height="70" rx="4" fill="none" stroke="#5a6a7c" stroke-width="0.8" opacity="0.3"/>
    <text x="50" y="30" font-family="system-ui,sans-serif" font-size="9" fill="#E8590C" text-anchor="middle" opacity="0.7">01</text>
    <text x="50" y="50" font-family="system-ui,sans-serif" font-size="12" fill="#fff" text-anchor="middle" opacity="0.8">材料備料</text>
    <!-- 箭頭 -->
    <path d="M 115 35 L 140 35" stroke="#E8590C" stroke-width="1.5" opacity="0.4"/>
    <path d="M 136 30 L 143 35 L 136 40" fill="none" stroke="#E8590C" stroke-width="1.5" opacity="0.4"/>
    <!-- Step 2 -->
    <rect x="155" y="0" width="100" height="70" rx="4" fill="#ffffff" opacity="0.04"/>
    <rect x="155" y="0" width="100" height="70" rx="4" fill="none" stroke="#5a6a7c" stroke-width="0.8" opacity="0.3"/>
    <text x="205" y="30" font-family="system-ui,sans-serif" font-size="9" fill="#E8590C" text-anchor="middle" opacity="0.7">02</text>
    <text x="205" y="50" font-family="system-ui,sans-serif" font-size="12" fill="#fff" text-anchor="middle" opacity="0.8">雷射切割</text>
    <!-- 箭頭 -->
    <path d="M 270 35 L 295 35" stroke="#E8590C" stroke-width="1.5" opacity="0.4"/>
    <path d="M 291 30 L 298 35 L 291 40" fill="none" stroke="#E8590C" stroke-width="1.5" opacity="0.4"/>
    <!-- Step 3 -->
    <rect x="310" y="0" width="100" height="70" rx="4" fill="#E8590C" opacity="0.1"/>
    <rect x="310" y="0" width="100" height="70" rx="4" fill="none" stroke="#E8590C" stroke-width="1" opacity="0.5"/>
    <text x="360" y="30" font-family="system-ui,sans-serif" font-size="9" fill="#E8590C" text-anchor="middle" opacity="0.9">03</text>
    <text x="360" y="50" font-family="system-ui,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">組裝成型</text>
  </g>
  <!-- 下方：成品鋼板 -->
  <g transform="translate(280, 210)">
    <rect x="0" y="0" width="200" height="80" rx="2" fill="#3D4D5E" opacity="0.25"/>
    <rect x="0" y="0" width="200" height="80" rx="2" fill="none" stroke="#5a6a7c" stroke-width="1" opacity="0.3"/>
    <rect x="0" y="80" width="200" height="8" fill="#2B3A4A" opacity="0.4"/>
    <text x="100" y="48" font-family="system-ui,sans-serif" font-size="11" fill="#9AA5AE" text-anchor="middle" opacity="0.4">成品</text>
  </g>
  <!-- 標題 -->
  <rect x="60" y="350" width="40" height="2" rx="1" fill="#E8590C" opacity="0.8"/>
  <text x="60" y="382" font-family="system-ui,sans-serif" font-size="24" fill="#ffffff" font-weight="700" opacity="0.95">底模鋼板製作過程</text>
  <text x="60" y="405" font-family="system-ui,sans-serif" font-size="13" fill="#9AA5AE" font-weight="400">Steel Base Board Production</text>
  <rect x="660" y="365" width="80" height="28" rx="14" fill="#ffffff" opacity="0.1"/>
  <text x="700" y="384" font-family="system-ui,sans-serif" font-size="11" fill="#9AA5AE" text-anchor="middle">▶ Instagram</text>
</svg>
