<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12"/><stop offset="100%" stop-color="#1A232D"/>
    </linearGradient>
    <linearGradient id="metal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D4D5E"/><stop offset="50%" stop-color="#5a6a7c"/><stop offset="100%" stop-color="#2B3A4A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>
  <!-- 鋼板示意 -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="240" height="180" rx="3" fill="url(#metal2)" opacity="0.3"/>
    <rect x="0" y="0" width="240" height="180" rx="3" fill="none" stroke="#5a6a7c" stroke-width="1.5" opacity="0.5"/>
    <rect x="0" y="180" width="240" height="12" rx="1" fill="#2B3A4A" opacity="0.6"/>
    <!-- 表面紋理 -->
    <line x1="30" y1="30" x2="210" y2="30" stroke="#6B7B8B" stroke-width="0.5" opacity="0.2"/>
    <line x1="30" y1="60" x2="210" y2="60" stroke="#6B7B8B" stroke-width="0.5" opacity="0.2"/>
    <line x1="30" y1="90" x2="210" y2="90" stroke="#6B7B8B" stroke-width="0.5" opacity="0.2"/>
    <line x1="30" y1="120" x2="210" y2="120" stroke="#6B7B8B" stroke-width="0.5" opacity="0.2"/>
    <line x1="30" y1="150" x2="210" y2="150" stroke="#6B7B8B" stroke-width="0.5" opacity="0.2"/>
    <!-- 厚度標註 -->
    <line x1="255" y1="0" x2="255" y2="192" stroke="#E8590C" stroke-width="0.8" opacity="0.5"/>
    <line x1="250" y1="0" x2="260" y2="0" stroke="#E8590C" stroke-width="0.8" opacity="0.5"/>
    <line x1="250" y1="192" x2="260" y2="192" stroke="#E8590C" stroke-width="0.8" opacity="0.5"/>
    <text x="270" y="100" font-family="system-ui,sans-serif" font-size="11" fill="#E8590C" opacity="0.6">1~5mm</text>
    <!-- 光澤 -->
    <rect x="40" y="10" width="80" height="160" fill="#ffffff" opacity="0.02"/>
  </g>
  <!-- 標題 -->
  <rect x="60" y="350" width="40" height="2" rx="1" fill="#E8590C" opacity="0.8"/>
  <text x="60" y="382" font-family="system-ui,sans-serif" font-size="24" fill="#ffffff" font-weight="700" opacity="0.95">底模鋼板介紹</text>
  <text x="60" y="405" font-family="system-ui,sans-serif" font-size="13" fill="#9AA5AE" font-weight="400">Steel Base Board Introduction</text>
  <rect x="660" y="365" width="80" height="28" rx="14" fill="#ffffff" opacity="0.1"/>
  <text x="700" y="384" font-family="system-ui,sans-serif" font-size="11" fill="#9AA5AE" text-anchor="middle">▶ Instagram</text>
</svg>
