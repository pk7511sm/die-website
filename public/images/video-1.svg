  <rect x="660" y="365" width="80" height="28" rx="14" fill="#ffffff" opacity="0.1"/>
  <text x="700" y="384" font-family="system-ui,sans-serif" font-size="11" fill="#9AA5AE" text-anchor="middle">▶ Instagram</text>
</svg>
