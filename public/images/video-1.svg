<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12"/><stop offset="100%" stop-color="#1A232D"/>
    </linearGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#E8590C" stop-opacity="0.08"/><stop offset="100%" stop-color="#E8590C" stop-opacity="0"/>
    </radialGradient>
    <filter id="gl1"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <rect width="800" height="450" fill="url(#g1)"/>
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>
  <!-- 雷射光束 -->
  <rect x="398" y="40" width="4" height="250" fill="#E8590C" opacity="0.5"/>
  <rect x="396" y="60" width="1" height="230" fill="#E8590C" opacity="0.15"/>
  <rect x="403" y="60" width="1" height="230" fill="#E8590C" opacity="0.15"/>
  <circle cx="400" cy="295" r="18" fill="#E8590C" opacity="0.15" filter="url(#gl1)"/>
  <circle cx="400" cy="295" r="8" fill="#E8590C" opacity="0.4" filter="url(#gl1)"/>
  <circle cx="400" cy="295" r="3" fill="#fff"/>
  <!-- 雷射頭 -->
  <polygon points="388,35 412,35 406,52 394,52" fill="#5a6a7c" opacity="0.7"/>
  <rect x="395" y="50" width="10" height="5" fill="#E8590C" opacity="0.8"/>
  <!-- 火花 -->
  <circle cx="410" cy="288" r="1.5" fill="#FFB088" opacity="0.8" filter="url(#gl1)"/>
  <circle cx="392" cy="284" r="1.2" fill="#E8590C" opacity="0.7" filter="url(#gl1)"/>
  <circle cx="406" cy="278" r="1" fill="#fff" opacity="0.5"/>
  <!-- 標題 -->
  <rect x="60" y="350" width="40" height="2" rx="1" fill="#E8590C" opacity="0.8"/>
  <text x="60" y="382" font-family="system-ui,sans-serif" font-size="24" fill="#ffffff" font-weight="700" opacity="0.95">自有雷射機切割過程</text>
  <text x="60" y="405" font-family="system-ui,sans-serif" font-size="13" fill="#9AA5AE" font-weight="400">Laser Cutting Process</text>
