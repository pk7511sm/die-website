<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12"/>
      <stop offset="100%" stop-color="#181D24"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="38%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#E8590C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E8590C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="laserHit" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#FFB088"/>
      <stop offset="40%" stop-color="#E8590C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8590C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8590C" stop-opacity="0"/>
      <stop offset="60%" stop-color="#E8590C" stop-opacity="0.4"/>
      <stop offset="95%" stop-color="#E8590C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="plateTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D4D5E"/>
      <stop offset="100%" stop-color="#2A3744"/>
    </linearGradient>
    <linearGradient id="plateSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232E38"/>
      <stop offset="100%" stop-color="#1A232D"/>
    </linearGradient>
    <filter id="glow8"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glow4"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#ambientGlow)"/>

  <!-- 精密網格（極淡） -->
  <g opacity="0.025" stroke="#fff" stroke-width="0.5">
    <line x1="160" y1="0" x2="160" y2="600"/><line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/><line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
  </g>

  <!-- ==================== 刀模底板（3D 透視） ==================== -->
  <g transform="translate(50, 160)">
    <!-- 底板側面（厚度感） -->
    <polygon points="20,280 340,280 360,300 40,300" fill="url(#plateSide)" opacity="0.6"/>
    <!-- 底板頂面 -->
    <rect x="20" y="20" width="320" height="260" rx="2" fill="url(#plateTop)" opacity="0.2"/>
    <rect x="20" y="20" width="320" height="260" rx="2" fill="none" stroke="#5a6a7c" stroke-width="0.8" opacity="0.3"/>

    <!-- 主要刀線（橘色，粗，醒目） -->
    <rect x="60" y="60" width="240" height="150" rx="10" fill="none" stroke="#E8590C" stroke-width="2.5" opacity="0.8"/>

    <!-- 內部壓線 -->
    <line x1="140" y1="60" x2="140" y2="210" stroke="#7A8A9A" stroke-width="0.8" stroke-dasharray="5 4" opacity="0.3"/>
    <line x1="220" y1="60" x2="220" y2="210" stroke="#7A8A9A" stroke-width="0.8" stroke-dasharray="5 4" opacity="0.3"/>
    <line x1="60" y1="135" x2="300" y2="135" stroke="#7A8A9A" stroke-width="0.8" stroke-dasharray="5 4" opacity="0.3"/>

    <!-- 四角接點亮點 -->
    <circle cx="60" cy="60" r="3.5" fill="#E8590C" opacity="0.65"/>
    <circle cx="300" cy="60" r="3.5" fill="#E8590C" opacity="0.65"/>
    <circle cx="60" cy="210" r="3.5" fill="#E8590C" opacity="0.65"/>
    <circle cx="300" cy="210" r="3.5" fill="#E8590C" opacity="0.65"/>
  </g>

  <!-- ==================== 雷射光束（戲劇性照明） ==================== -->
  <g>
    <!-- 大範圍環境光暈 -->
    <ellipse cx="380" cy="420" rx="100" ry="60" fill="#E8590C" opacity="0.06" filter="url(#glow20)"/>

    <!-- 主光束 -->
    <rect x="378" y="0" width="4" height="415" fill="url(#beam)"/>
    <!-- 側光（微弱） -->
    <rect x="375" y="80" width="1" height="335" fill="#E8590C" opacity="0.12"/>
    <rect x="384" y="80" width="1" height="335" fill="#E8590C" opacity="0.12"/>

    <!-- 切割命中點 -->
    <circle cx="380" cy="420" r="28" fill="url(#laserHit)" filter="url(#glow8)"/>
    <circle cx="380" cy="420" r="3.5" fill="#ffffff"/>

    <!-- 火花 -->
    <g filter="url(#glow4)">
      <circle cx="392" cy="410" r="1.8" fill="#FFB088" opacity="0.9"/>
      <circle cx="400" cy="400" r="1.2" fill="#E8590C" opacity="0.7"/>
      <circle cx="368" cy="406" r="1.5" fill="#FFB088" opacity="0.8"/>
      <circle cx="362" cy="396" r="1" fill="#E8590C" opacity="0.6"/>
      <circle cx="390" cy="394" r="0.9" fill="#fff" opacity="0.5"/>
      <circle cx="372" cy="414" r="1.3" fill="#E8590C" opacity="0.5"/>
      <circle cx="396" cy="416" r="0.8" fill="#FFB088" opacity="0.6"/>
      <circle cx="366" cy="388" r="0.7" fill="#fff" opacity="0.3"/>
      <circle cx="386" cy="386" r="1.1" fill="#E8590C" opacity="0.4"/>
    </g>
  </g>

  <!-- ==================== 右側資訊面板 ==================== -->
  <g transform="translate(500, 70)">

    <!-- 刀片規格 -->
    <text x="0" y="0" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7B8B" letter-spacing="3" font-weight="500">BLADE HEIGHT</text>
    <text x="0" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="36" fill="#ffffff" font-weight="700" letter-spacing="-1">23.4<tspan font-size="20" fill="#6B7B8B" font-weight="400"> – </tspan>55<tspan font-size="16" fill="#6B7B8B" font-weight="400" dx="4">mm</tspan></text>
    <text x="0" y="62" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#7A8A9A" font-weight="400">標準刀 · 高刀 · 特殊刀材</text>

    <!-- 分隔線 -->
    <line x1="0" y1="82" x2="240" y2="82" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>

    <!-- 核心能力 -->
    <text x="0" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7B8B" letter-spacing="3" font-weight="500">CORE CAPABILITIES</text>

    <g transform="translate(0, 132)">
      <rect x="0" y="0" width="3" height="14" rx="1" fill="#E8590C" opacity="0.8"/>
      <text x="14" y="12" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" font-weight="500" opacity="0.9">雷射切割</text>
      <text x="110" y="12" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7B8B" font-weight="400">Laser Cutting</text>
    </g>
    <g transform="translate(0, 164)">
      <rect x="0" y="0" width="3" height="14" rx="1" fill="#E8590C" opacity="0.8"/>
      <text x="14" y="12" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" font-weight="500" opacity="0.9">精密彎刀</text>
      <text x="110" y="12" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7B8B" font-weight="400">Steel Rule Bending</text>
    </g>
    <g transform="translate(0, 196)">
      <rect x="0" y="0" width="3" height="14" rx="1" fill="#E8590C" opacity="0.8"/>
      <text x="14" y="12" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" font-weight="500" opacity="0.9">無縫接點技術</text>
      <text x="138" y="12" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7B8B" font-weight="400">Joint Finishing</text>
    </g>
    <g transform="translate(0, 228)">
      <rect x="0" y="0" width="3" height="14" rx="1" fill="#E8590C" opacity="0.8"/>
      <text x="14" y="12" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" font-weight="500" opacity="0.9">特殊刀材庫存</text>
      <text x="138" y="12" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#6B7B8B" font-weight="400">Specialty Blades</text>
    </g>

    <!-- 分隔線 -->
    <line x1="0" y1="264" x2="240" y2="264" stroke="#ffffff" stroke-width="0.5" opacity="0.07"/>

    <!-- 年份 -->
    <text x="0" y="294" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7B8B" letter-spacing="3" font-weight="500">ESTABLISHED</text>
    <text x="0" y="340" font-family="system-ui,-apple-system,sans-serif" font-size="48" fill="#ffffff" font-weight="700" letter-spacing="-2" opacity="0.95">1999</text>
    <rect x="0" y="356" width="40" height="2" rx="1" fill="#E8590C" opacity="0.7"/>
    <text x="0" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#E8590C" font-weight="500" opacity="0.7">25+ Years of Die-Making Expertise</text>
  </g>

  <!-- ==================== 底部橫條 ==================== -->
  <line x1="0" y1="548" x2="800" y2="548" stroke="#E8590C" stroke-width="0.8" opacity="0.2"/>
  <rect x="0" y="549" width="800" height="51" fill="#0A0C0E" opacity="0.5"/>

  <text x="80" y="580" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7B8B" letter-spacing="4" font-weight="500">LASER</text>
  <circle cx="142" cy="577" r="1.5" fill="#E8590C" opacity="0.5"/>
  <text x="160" y="580" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7B8B" letter-spacing="4" font-weight="500">BENDING</text>
  <circle cx="258" cy="577" r="1.5" fill="#E8590C" opacity="0.5"/>
  <text x="276" y="580" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7B8B" letter-spacing="4" font-weight="500">PRECISION</text>
  <circle cx="392" cy="577" r="1.5" fill="#E8590C" opacity="0.5"/>
  <text x="410" y="580" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7B8B" letter-spacing="4" font-weight="500">QUALITY</text>

  <text x="720" y="580" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#E8590C" font-weight="700" letter-spacing="2" opacity="0.5">JINLI</text>
</svg>
