<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12"/>
      <stop offset="100%" stop-color="#181D24"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="35%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#E8590C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E8590C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="laserHit" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#FFB088"/>
      <stop offset="40%" stop-color="#E8590C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E8590C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8590C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8590C" stop-opacity="0.3"/>
      <stop offset="95%" stop-color="#E8590C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="plateTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D4D5E"/>
      <stop offset="100%" stop-color="#2A3744"/>
    </linearGradient>
    <linearGradient id="plateSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232E38"/>
      <stop offset="100%" stop-color="#1A232D"/>
    </linearGradient>
    <filter id="glow8"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glow4"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#ambientGlow)"/>

  <!-- 精密網格（極淡） -->
  <g opacity="0.025" stroke="#fff" stroke-width="0.5">
    <line x1="160" y1="0" x2="160" y2="600"/><line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/><line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="230" x2="800" y2="230"/>
    <line x1="0" y1="310" x2="800" y2="310"/><line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="470" x2="800" y2="470"/>
  </g>

  <!-- ==================== 刀模底板（集中在中間） ==================== -->
  <g transform="translate(40, 155)">
    <!-- 底板側面 -->
    <polygon points="10,230 300,230 316,248 26,248" fill="url(#plateSide)" opacity="0.5"/>
    <!-- 底板頂面 -->
    <rect x="10" y="10" width="290" height="220" rx="2" fill="url(#plateTop)" opacity="0.18"/>
    <rect x="10" y="10" width="290" height="220" rx="2" fill="none" stroke="#5a6a7c" stroke-width="0.8" opacity="0.3"/>

    <!-- 主要刀線 -->
    <rect x="40" y="40" width="230" height="140" rx="8" fill="none" stroke="#E8590C" stroke-width="2.5" opacity="0.8"/>

    <!-- 壓線 -->
    <line x1="120" y1="40" x2="120" y2="180" stroke="#7A8A9A" stroke-width="0.8" stroke-dasharray="5 4" opacity="0.3"/>
    <line x1="190" y1="40" x2="190" y2="180" stroke="#7A8A9A" stroke-width="0.8" stroke-dasharray="5 4" opacity="0.3"/>
    <line x1="40" y1="110" x2="270" y2="110" stroke="#7A8A9A" stroke-width="0.8" stroke-dasharray="5 4" opacity="0.3"/>

    <!-- 接點亮點 -->
    <circle cx="40" cy="40" r="3" fill="#E8590C" opacity="0.65"/>
    <circle cx="270" cy="40" r="3" fill="#E8590C" opacity="0.65"/>
    <circle cx="40" cy="180" r="3" fill="#E8590C" opacity="0.65"/>
    <circle cx="270" cy="180" r="3" fill="#E8590C" opacity="0.65"/>
  </g>

  <!-- ==================== 雷射光束 ==================== -->
  <g>
    <!-- 環境光 -->
    <ellipse cx="360" cy="370" rx="80" ry="50" fill="#E8590C" opacity="0.05" filter="url(#glow20)"/>

    <!-- 光束 -->
    <rect x="358" y="60" width="4" height="305" fill="url(#beam)"/>
    <rect x="355" y="120" width="1" height="245" fill="#E8590C" opacity="0.1"/>
    <rect x="364" y="120" width="1" height="245" fill="#E8590C" opacity="0.1"/>

    <!-- 命中點 -->
    <circle cx="360" cy="370" r="24" fill="url(#laserHit)" filter="url(#glow8)"/>
    <circle cx="360" cy="370" r="3" fill="#ffffff"/>

    <!-- 火花 -->
    <g filter="url(#glow4)">
      <circle cx="372" cy="360" r="1.6" fill="#FFB088" opacity="0.9"/>
      <circle cx="378" cy="352" r="1" fill="#E8590C" opacity="0.7"/>
      <circle cx="348" cy="358" r="1.4" fill="#FFB088" opacity="0.8"/>
      <circle cx="343" cy="350" r="0.9" fill="#E8590C" opacity="0.6"/>
      <circle cx="370" cy="348" r="0.8" fill="#fff" opacity="0.5"/>
      <circle cx="352" cy="364" r="1.2" fill="#E8590C" opacity="0.5"/>
      <circle cx="376" cy="366" r="0.7" fill="#FFB088" opacity="0.6"/>
    </g>
  </g>

  <!-- ==================== 右側資訊（全部集中在中間帶） ==================== -->
  <g transform="translate(480, 140)">

    <!-- 刀片規格 -->
    <text x="0" y="0" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6B7B8B" letter-spacing="3" font-weight="500">BLADE HEIGHT</text>
    <text x="0" y="36" font-family="system-ui,-apple-system,sans-serif" font-size="32" fill="#ffffff" font-weight="700" letter-spacing="-1">23.4<tspan font-size="18" fill="#6B7B8B" font-weight="400"> – </tspan>55<tspan font-size="14" fill="#6B7B8B" font-weight="400" dx="3">mm</tspan></text>
    <text x="0" y="54" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#7A8A9A" font-weight="400">標準刀 · 高刀 · 特殊刀材</text>

    <!-- 分隔線 -->
    <line x1="0" y1="72" x2="260" y2="72" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>

    <!-- 核心能力 -->
    <text x="0" y="96" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6B7B8B" letter-spacing="3" font-weight="500">CORE CAPABILITIES</text>

    <g transform="translate(0, 114)">
      <rect x="0" y="0" width="3" height="13" rx="1" fill="#E8590C" opacity="0.8"/>
      <text x="12" y="11" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="500" opacity="0.9">雷射切割</text>
      <text x="100" y="11" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7B8B" font-weight="400">Laser Cutting</text>
    </g>
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="3" height="13" rx="1" fill="#E8590C" opacity="0.8"/>
      <text x="12" y="11" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="500" opacity="0.9">精密彎刀</text>
      <text x="100" y="11" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7B8B" font-weight="400">Steel Rule Bending</text>
    </g>
    <g transform="translate(0, 166)">
      <rect x="0" y="0" width="3" height="13" rx="1" fill="#E8590C" opacity="0.8"/>
      <text x="12" y="11" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="500" opacity="0.9">無縫接點技術</text>
      <text x="126" y="11" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7B8B" font-weight="400">Seamless Joints</text>
    </g>
    <g transform="translate(0, 192)">
      <rect x="0" y="0" width="3" height="13" rx="1" fill="#E8590C" opacity="0.8"/>
      <text x="12" y="11" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#ffffff" font-weight="500" opacity="0.9">特殊刀材庫存</text>
      <text x="126" y="11" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#6B7B8B" font-weight="400">Specialty Blades</text>
    </g>

    <!-- 分隔線 -->
    <line x1="0" y1="224" x2="260" y2="224" stroke="#ffffff" stroke-width="0.5" opacity="0.06"/>

    <!-- 年份 -->
    <text x="0" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="9" fill="#6B7B8B" letter-spacing="3" font-weight="500">ESTABLISHED</text>
    <text x="0" y="286" font-family="system-ui,-apple-system,sans-serif" font-size="40" fill="#ffffff" font-weight="700" letter-spacing="-2" opacity="0.95">1999</text>
    <rect x="0" y="298" width="36" height="2" rx="1" fill="#E8590C" opacity="0.7"/>
    <text x="0" y="318" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#E8590C" font-weight="500" opacity="0.65">25+ Years of Expertise</text>
  </g>
</svg>
